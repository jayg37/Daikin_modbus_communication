alias: Sync Upstairs Mini Split Setpoint
description: ""

triggers:
  # Run only when the downstairs Honeywell target setpoint changes
  - trigger: state
    entity_id: climate.tstat_24d76e_t6_pro_thermostat
    attribute: temperature

conditions: []

actions:
  - variables:
      # Current downstairs Honeywell target temperature
      downstairs_setpoint: >
        {{ state_attr(
          'climate.tstat_24d76e_t6_pro_thermostat',
          'temperature'
        ) | float(72) }}

      # Upstairs Daikin target = downstairs +2°F,
      # but never below 70°F during the current cooling-season baseline.
      upstairs_target: >
        {{ [downstairs_setpoint + 2, 70] | max }}

  # Set only the Daikin temperature setpoint.
  # HVAC mode is intentionally not touched in this baseline version.
  - action: climate.set_temperature
    target:
      entity_id: climate.daikin_mini_split
    data:
      temperature: "{{ upstairs_target }}"

mode: restart
